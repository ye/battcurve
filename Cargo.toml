[package]
name = "battcurve"
version = "0.1.0"
edition = "2021"
description = "Sample and visualize laptop battery charge / discharge / dQ-dV / health curves"
license = "MIT"

[[bin]]
name = "battcurve"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
ctrlc = "3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Web server
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
